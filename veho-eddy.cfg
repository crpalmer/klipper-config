[z_tilt]
z_positions: 50,0
    50,600
    550,600
    550,0
points: 100,65
    100,525
    500,525
    500,65
speed: 400

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340408B8961C-if00
restart_method: command

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 60.0
descend_z: 2.5

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# todo: test scan overshoot
[bed_mesh]
algorithm: bicubic
horizontal_move_z: 2
speed: 100
mesh_min: 20,62
mesh_max: 575,585
probe_count: 15,15
fade_start: 0.6
fade_end: 10
split_delta_z: 0.01
move_check_distance: 3
mesh_pps: 3,3

[safe_z_home]
home_xy_position=300,240
speed: 400
z_hop: 5

