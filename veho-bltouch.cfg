[safe_z_home]
home_xy_position=300,300
speed: 400
z_hop: 5

[probe] ## Other parameters in config.cfg
pin: !PB30
x_offset: 0.0
y_offset: 0.0
z_offset: -0.10
speed: 10.0 #   Speed (in mm/s) of the Z axis when probing. The default is 5mm/s.
samples: 2
sample_retract_dist: 5.0
lift_speed: 10
samples_tolerance: 0.02
samples_tolerance_retries: 5
activate_gcode:
    DEPLOY_PZ_PROBE
    G4 P1000
deactivate_gcode:
    RETRACT_PZ_PROBE

[bed_mesh]
algorithm: bicubic
speed: 400
mesh_min: 25,25
mesh_max: 575,575
probe_count: 9,9
fade_end: 10
zero_reference_position: 300,300
adaptive_margin: 5

[z_tilt]
z_positions: 50,0
    50,600
    550,600
    550,0
points: 150,150
    150,450
    450,450
    450,150
speed: 400
