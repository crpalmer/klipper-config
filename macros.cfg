[gcode_macro wipe_hotend_base]
gcode:
    {% set lower_x = params.LOWER_X|int %}
    {% set lower_y = params.LOWER_Y|int %}
    {% set width   = params.WIDTH|int %}
    {% set height  = params.HEIGHT|int %}
    {% set extra_x = params.EXTRA_X|default(1)|int %}
    {% set extra_y = params.EXTRA_Y|default(1)|int %}
    {% set y_ramp = params.Y_RAMP|default(10)|int %}

    {% set fan_speed = printer.fan.speed %}
    M106 S255
    G4 P1000

    {% for passes in range(3) %}
	G1 X{lower_x - extra_x} Y{lower_y - extra_y - y_ramp} F24000
	G1 Y{lower_y - extra_y}
	G1 X{lower_x + width + extra_x} Y{lower_y + height + extra_y}
	G1 Y{lower_y + height + extra_y + y_ramp}
	G1 X{lower_x - extra_x}
	G1 X{lower_x + width + extra_x} Y{lower_y - extra_y}
    {% endfor %}
    M106 S{255 * fan_speed}

[gcode_macro home_with_wipe]
gcode:
    G28 X Y
    WIPE_HOTEND
    G28 Z
    PARK_HOTEND

[gcode_macro print_start]
gcode:
    {% set has_bltouch = ('bltouch' in printer.configfile.settings) %}
    {% set has_eddy = ('probe_eddy_current btt_eddy' in printer.configfile.settings) %}
    {% set has_beacon = ('beacon' in printer.configfile.settings) %}
    {% set has_piezo = not has_bltouch and not has_eddy and not has_beacon %}

    {% set has_scanning_probe = has_beacon or has_eddy %}
    {% set has_contact_probe = has_beacon or has_eddy or has_piezo %}

    {% set bed_temp = params.BED|default(60)|int %}
    {% set hotend_temp = params.HOTEND|default(220)|int %}
    {% set hotend_temp_delta = 70 if has_contact_probe else 30 %}
    {% set mesh = params.MESH|default(1)|int %}
    {% set adaptive = (1 if 'adaptive_margin' in printer.configfile.settings.bed_mesh and printer.configfile.settings.bed_mesh.adaptive_margin > 0 else 0) %}

    G90         # absolute positioning
    M83		# relative extrusions
    M106 S0	# stop the part cooling fan
    M220 S100	# reset speed multiplier
    M221 S100	# reset extrusion multiplier
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0

    M118 Heating bed and nozzle for probing

    {% set bed_probe_temp = 60 if bed_temp > 60 else bed_temp %}
    {% set hotend_probe_temp = hotend_temp - hotend_temp_delta %}
    M104 S{hotend_probe_temp}
    M140 S{bed_temp}

    G28 X Y

    TEMPERATURE_WAIT sensor=heater_bed minimum={bed_probe_temp - 2} maximum={bed_temp + 5}
    {% if has_contact_probe %}
	TEMPERATURE_WAIT sensor=extruder minimum={hotend_probe_temp - 2} maximum={hotend_probe_temp + 5}
    {% endif %}

    {% if has_contact_probe %}
	G28 Z
	{% if has_beacon %}
	    M118 Soaking the Beacon probe for 1 minute...
	    G1 Z2
	    G4 P60000
	    M118 Performing real Z homing now
            WIPE_HOTEND
            G28 Z method=CONTACT calibrate=1
	{% else %}
            WIPE_HOTEND
	{% endif %}
    {% else %}
        G28 Z
    {% endif %}
    Z_TILT_ADJUST
    G28 Z
    {% if mesh %}
        {% if has_eddy %}
	    BED_MESH_CALIBRATE adaptive={adaptive} method=rapid_scan
	{% else %}
	    BED_MESH_CALIBRATE adaptive={adaptive}
	{% endif %}
    {% endif %}

    PARK_HOTEND wiping=1
    M118 Heating nozzle and bed for printing

    M104 S{hotend_temp}
    M140 S{bed_temp}
    TEMPERATURE_WAIT sensor=heater_bed minimum={bed_temp - 2} maximum={bed_temp + 5}
    TEMPERATURE_WAIT sensor=extruder minimum={hotend_temp - 2} maximum={hotend_temp + 5}

    # Prime nozzle and wipe
    G1 E10 F150
    G1 E-2 F3600

    M106 S255
    G4 S500		# wait a little longer to let the filament harden
    WIPE_HOTEND
    M106 S0

    G1 E2 F3600

[gcode_macro turn_everything_off]
gcode:
    M140 S0
    M104 S0
    M106 S0
    M400
    M84

[gcode_macro print_error]
gcode:
    MQTT msg="Print encountered an error"
    PRINT_END_MOVEMENT
    TURN_EVERYTHING_OFF

[gcode_macro print_end]
gcode:
    MQTT msg="Print complete"
    PRINT_END_MOVEMENT
    TURN_EVERYTHING_OFF

[gcode_macro cancel_print]
rename_existing: CANCEL_PRINT_BASE2
gcode:
    PRINT_END_MOVEMENT
    CANCEL_PRINT_BASE2
    TURN_EVERYTHING_OFF

[gcode_macro filament_load]
gcode:
    {% set speed1 = params.SPEED1|default(180)|int %}
    {% set speed2 = params.SPEED2|default(300)|int %}
    {% set mm1 = params.MM1|default(50)|int %}
    {% set mm2 = params.MM2|default(100)|int %}

    SAVE_GCODE_STATE

    M118 Feeding filament

    M83
    G1 E{mm1} F{speed1}
    G1 E{mm2} F{speed2}
    M400

    M118 Done

    RESTORE_GCODE_STATE

[gcode_macro filament_unload]
gcode:
    SAVE_GCODE_STATE

    M83
    M118 Extruding a little filament for tip forming
    G1 E10 F120
    G1 E-10 F3600
    M400
    M118 Cooling
    G4 P{15*1000}
    G1 E-200 F3600
    M400
    M118 Done

    RESTORE_GCODE_STATE

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(2)|int %}                                                    ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                  ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume

        BASE_PAUSE                                                                           ; pause print

        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
            G90                                                                                  ; absolute positioning
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}

	PARK_HOTEND

        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(5)|int %}                                            ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
	G90
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=400                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)

        M83                                                                          ; relative extruder positioning
	{% set fan_speed = printer.fan.speed %}
	M106 S255
	G4 P250
        G1 E{e} F150                                                                 ; prime nozzle by E
	G1 E-2 F3600
	G4 P500
	WIPE_HOTEND
	M106 S{255 * fan_speed}

        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=400                         ; restore position

	G91
        G1 Z{zhop * -1} F900                                                         ; lower Z back down
	G90
	G1 E2 F3600

        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                          ; enable filament sensor
        BASE_RESUME                                                                  ; resume print
    {% endif %}

[gcode_macro MQTT]
variable_hostname: "UNKNOWN"
gcode:
  {% set msg = params.MSG|default("<empty mqtt message>") %}
  {action_call_remote_method("publish_mqtt_topic",
                             topic="alerts/" + hostname,
                             payload=msg,
                             qos=0,
                             retain=False,
                             use_prefix=False)}
  M118 MQTT message sent: {msg}
